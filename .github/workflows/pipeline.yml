name: Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  checkout:
    name: Checkout Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Repository Information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Triggered By: $GITHUB_ACTOR"
          echo "Commit: $GITHUB_SHA"

      - name: Display Project Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort

  docker-validation:
    name: Install and Validate Docker
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Docker Installation
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker not found. Installing..."
            sudo apt-get update
            sudo apt-get install -y docker.io
          else
            echo "Docker already installed."
          fi

          docker --version

      - name: Start Docker Service
        run: |
          sudo systemctl start docker || true
          docker info

      - name: Check Docker Compose Installation
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose not found. Installing..."
            sudo apt-get update
            sudo apt-get install -y docker-compose-v2
          else
            echo "Docker Compose already installed."
          fi

          docker compose version

      - name: Pull Validation Image
        run: |
          docker pull nginx:latest

      - name: Show Images
        run: |
          docker images

      - name: Validate Compose File
        run: |
          docker compose config --quiet

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Unit Tests
        working-directory: backend
        run: |
          node --test server.test.js

  sast:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    needs: checkout

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  configuration-security:
    name: Checkov Configuration Security
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Run Checkov
        run: |
          checkov -d . --framework dockerfile,yaml

  docker-build:
    name: Build Frontend and Backend Images
    runs-on: ubuntu-latest
    needs:
      - docker-validation
      - secret-scan
      - unit-tests
      - sast
      - configuration-security

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Build Backend Image
        run: |
          docker build -t pipeline-demo-backend:local ./backend

      - name: Build Frontend Image
        run: |
          docker build -t pipeline-demo-frontend:local ./frontend

      - name: Show Docker Images
        run: |
          docker images

      - name: Docker Compose Build
        run: |
          docker compose build

  image-security:
    name: Trivy Container Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t pipeline-demo-backend:local ./backend

      - name: Build Frontend Image
        run: |
          docker build -t pipeline-demo-frontend:local ./frontend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pipeline-demo-backend:local
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pipeline-demo-frontend:local
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH