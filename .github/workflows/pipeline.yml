
name: Enterprise DevSecOps Pipeline Demo

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

  workflow_dispatch:

jobs:

  checkout:
    name: Checkout Source Code
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Display Runner Information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered By: ${{ github.actor }}"

      - name: Show Current Directory
        run: pwd

      - name: List Repository Contents
        run: ls -la

      - name: Show Repository Structure
        run: find . -type f | sort

  docker-validation:
    name: Docker and Docker Compose Validation
    runs-on: ubuntu-24.04
    needs: checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Docker Installation
        run: |
          echo "Checking Docker..."
          docker --version

      - name: Check Docker Compose Installation
        run: |
          echo "Checking Docker Compose..."
          docker compose version

      - name: Display Docker Information
        run: |
          docker info

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating Docker Compose configuration..."
          docker compose config --quiet
          echo "Docker Compose configuration is valid."

      - name: Pull Public Image
        run: |
          echo "Pulling nginx image..."
          docker pull nginx:latest

      - name: List Docker Images
        run: |
          docker images

      - name: List Running Containers
        run: |
          docker ps

      - name: List All Containers
        run: |
          docker ps -a

      - name: Display Agent Workspace
        run: |
          echo "Current Directory:"
          pwd

          echo ""
          echo "Workspace Contents:"
          ls -la

          echo ""
          echo "Repository Files:"
          find . -type f | sort

      - name: Validation Complete
        run: |
          echo "Docker validation completed successfully."

  docker-build:
    name: Build Frontend and Backend Images
    runs-on: ubuntu-24.04
    needs: docker-validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t devsecops-backend:latest \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t devsecops-frontend:latest \
            ./frontend

      - name: List Built Docker Images
        run: |
          echo "======================================"
          echo "       SUCCESSFULLY BUILT IMAGES"
          echo "======================================"

          docker images devsecops-backend:latest
          docker images devsecops-frontend:latest

          echo ""
          echo "======================================"
          echo "       ALL AVAILABLE DOCKER IMAGES"
          echo "======================================"

          docker images

      - name: Verify Backend Image
        run: |
          docker image inspect devsecops-backend:latest

      - name: Verify Frontend Image
        run: |
          docker image inspect devsecops-frontend:latest

      - name: Docker Build Complete
        run: |
          echo "Both frontend and backend Docker images were built successfully."
