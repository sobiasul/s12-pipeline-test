name: Enterprise DevSecOps Pipeline Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checkout:
    name: Checkout Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Display Runner Information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered By: ${{ github.actor }}"
      - name: Show Repository Structure
        run: find . -type f -not -path './.git/*' | sort

  docker-validation:
    name: Docker and Docker Compose Validation
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Check Docker Installation
        run: docker --version
      - name: Check Docker Compose Installation
        run: docker compose version
      - name: Display Docker Information
        run: docker info
      - name: Validate Compose Configuration
        run: docker compose config --quiet

  build-images:
    name: Build Application Images Locally
    runs-on: ubuntu-latest
    needs: docker-validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build Frontend and Backend Images
        run: docker compose build
      - name: List Built Images
        run: docker image ls pipeline-demo-frontend pipeline-demo-backend
