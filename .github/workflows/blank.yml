name: Enterprise DevSecOps Pipeline Demo

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  checkout:
    name: Checkout Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage
        run: |
          echo "Checking out source code..."
          sleep 2
          echo "Checkout completed."

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - run: |
          echo "Running unit tests..."
          sleep 2
          echo "Unit tests passed."

  code-quality:
    name: Code Quality Scan
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - run: |
          echo "Running code quality checks..."
          sleep 2
          echo "Code quality passed."

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - run: |
          echo "Scanning repository for secrets..."
          sleep 2
          echo "No secrets detected."

  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - run: |
          echo "Performing Static Application Security Testing..."
          sleep 2
          echo "SAST completed."

  config-scan:
    name: Configuration Scan
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - run: |
          echo "Scanning Kubernetes/Terraform configurations..."
          sleep 2
          echo "Configuration scan passed."

  vault-auth:
    name: Vault Authentication
    runs-on: ubuntu-latest
    needs:
      - unit-test
      - code-quality
      - secret-scan
      - sast
      - config-scan
    steps:
      - run: |
          echo "Authenticating to Vault..."
          echo "Vault Path: Dev-secret/kv/s10sobia2.wft/app"
          sleep 2
          echo "Vault authentication successful."

      - run: |
          echo "Retrieving application secrets..."
          sleep 2
          echo "Secrets retrieved successfully."

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: vault-auth
    steps:
      - run: |
          echo "Building Docker image..."
          sleep 2
          echo "Docker image built successfully."

  image-stabilization:
    name: Wait Before Security Scan
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - run: |
          echo "Waiting 5 minutes before image scanning..."
          sleep 300
          echo "Wait completed."

  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: image-stabilization
    steps:
      - run: |
          echo "Scanning image for vulnerabilities..."
          sleep 2
          echo "Image scan passed."

  ecr-auth:
    name: AWS ECR Authentication
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - run: |
          echo "Authenticating to AWS ECR..."
          sleep 2
          echo "AWS ECR authentication successful."

  push-image:
    name: Push Container Image
    runs-on: ubuntu-latest
    needs: ecr-auth
    steps:
      - run: |
          echo "Pushing image to AWS ECR..."
          sleep 2
          echo "Image pushed successfully."

  image-signing:
    name: Sign Container Image
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - run: |
          echo "Signing container image..."
          sleep 2
          echo "Image signing completed."

  bastion-auth:
    name: Bastion Authentication
    runs-on: ubuntu-latest
    needs: image-signing
    steps:
      - run: |
          echo "Connecting to bastion host..."
          echo "ssh s10sobia@bastion.devopseasylearning.net"
          sleep 2
          echo "Bastion authentication successful."

  clone-deployment-repo:
    name: Clone Deployment Repository
    runs-on: ubuntu-latest
    needs: bastion-auth
    steps:
      - run: |
          echo "Cloning deployment repository..."
          sleep 2
          echo "Deployment repository cloned."

  update-image-tag:
    name: Update Deployment Manifest
    runs-on: ubuntu-latest
    needs: clone-deployment-repo
    steps:
      - run: |
          echo "Replacing image tag in deployment manifest..."
          sleep 2
          echo "Deployment manifest updated."

  gitops-change:
    name: GitOps Commit and Push
    runs-on: ubuntu-latest
    needs: update-image-tag
    steps:
      - run: |
          echo "Committing GitOps changes..."
          sleep 2
          echo "Pushing GitOps changes..."
          sleep 2
          echo "GitOps repository updated."

  argocd-sync:
    name: ArgoCD Deployment
    runs-on: ubuntu-latest
    needs: gitops-change
    steps:
      - run: |
          echo "Triggering ArgoCD synchronization..."
          sleep 2
          echo "ArgoCD sync completed."

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: argocd-sync
    steps:
      - run: |
          echo "Sending deployment notification..."
          sleep 2
          echo "Notification delivered."
