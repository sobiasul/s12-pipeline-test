name: DevOps CI/CD Pipeline Demo

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  checkout:
    name: Checkout Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage
        run: |
          echo "Checking out source code..."
          sleep 2
          echo "Checkout completed."

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Run Unit Tests
        run: |
          echo "Running unit tests..."
          sleep 2
          echo "All unit tests passed."

  secret-scan:
    name: Repository Secret Scan
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Scan Repository
        run: |
          echo "Scanning repository for secrets..."
          sleep 2
          echo "No secrets found."

  vault-auth:
    name: Vault Authentication
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Authenticate to Vault
        run: |
          echo "Authenticating to Vault..."
          sleep 2
          echo "Vault authentication successful."

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: vault-auth
    steps:
      - name: Build Image
        run: |
          echo "Building Docker image..."
          sleep 2
          echo "Image build completed."

  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Scan Image
        run: |
          echo "Scanning Docker image for vulnerabilities..."
          sleep 2
          echo "Image scan passed."

  bastion-auth:
    name: Bastion Host Authentication
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - name: Connect to Bastion
        run: |
          echo "Authenticating to bastion host..."
          echo "ssh s10sobia@bastion.devopseasylearning.net"
          sleep 2
          echo "Bastion authentication successful."

  push-image:
    name: Push Container Image
    runs-on: ubuntu-latest
    needs: bastion-auth
    steps:
      - name: Push Image
        run: |
          echo "Pushing Docker image to container registry..."
          sleep 2
          echo "Image pushed successfully."

  clone-deployment-repo:
    name: Clone Deployment Repository
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - name: Clone Repo
        run: |
          echo "Cloning deployment repository..."
          sleep 2
          echo "Deployment repository cloned."

  update-image-tag:
    name: Update Deployment Manifest
    runs-on: ubuntu-latest
    needs: clone-deployment-repo
    steps:
      - name: Substitute Image Tag
        run: |
          echo "Updating deployment manifest with new image tag..."
          sleep 2
          echo "Image tag updated."

  push-deployment-repo:
    name: Push Changes to Deployment Repository
    runs-on: ubuntu-latest
    needs: update-image-tag
    steps:
      - name: Push Manifest Changes
        run: |
          echo "Pushing updated deployment manifests..."
          sleep 2
          echo "Changes pushed successfully."

  argocd-sync:
    name: ArgoCD Deployment
    runs-on: ubuntu-latest
    needs: push-deployment-repo
    steps:
      - name: ArgoCD Sync
        run: |
          echo "Triggering ArgoCD deployment..."
          sleep 2
          echo "ArgoCD synchronization completed."

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: argocd-sync
    steps:
      - name: Notify Team
        run: |
          echo "Sending deployment notification..."
          sleep 2
          echo "Notification delivered."
